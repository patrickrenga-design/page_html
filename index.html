<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Social links</title>
</head>
<body>
    <main class="social-card" aria-label="Social links">
        <a class="social-link" href="#">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9.25"></circle>
                <path d="M2.9 12h18.2M12 2.75c2.25 2.45 3.4 5.53 3.4 9.25S14.25 18.8 12 21.25C9.75 18.8 8.6 15.72 8.6 12S9.75 5.2 12 2.75ZM4.6 6.4c2.1 1.2 4.57 1.8 7.4 1.8s5.3-.6 7.4-1.8M4.6 17.6c2.1-1.2 4.57-1.8 7.4-1.8s5.3.6 7.4 1.8"></path>
            </svg>
            <span>Website</span>
            <span class="social-value">Website id</span>
        </a>

        <a class="social-link" href="#">
            <svg class="social-icon twitter-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21.5 6.25c-.7.3-1.45.5-2.25.6a3.9 3.9 0 0 0 1.7-2.15 7.7 7.7 0 0 1-2.45.94A3.86 3.86 0 0 0 11.8 8.3c0 .3.03.6.1.88a10.95 10.95 0 0 1-7.96-4.04 3.9 3.9 0 0 0 1.2 5.18 3.86 3.86 0 0 1-1.75-.48v.05a3.88 3.88 0 0 0 3.1 3.8c-.56.15-1.16.17-1.75.07a3.88 3.88 0 0 0 3.62 2.7A7.8 7.8 0 0 1 2.6 18.1a10.95 10.95 0 0 0 5.93 1.74c7.12 0 11.02-5.9 11.02-11.02v-.5c.76-.55 1.42-1.25 1.95-2.07Z"></path>
            </svg>
            <span>Twitter</span>
            <span class="social-value">Twitter id</span>
        </a>

        <a class="social-link" href="#">
            <svg class="social-icon facebook-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14.3 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.25-1.5 1.55-1.5h1.65V3.62c-.3-.04-1.32-.12-2.5-.12-2.47 0-4.16 1.5-4.16 4.25v2.15H8.05V13h2.79v8h3.46Z"></path>
            </svg>
            <span>Facebook</span>
            <span class="social-value">Facebook id</span>
        </a>

        <a class="social-link" href="#">
            <svg class="social-icon instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="4"></rect>
                <circle cx="12" cy="12" r="3.5"></circle>
                <circle class="instagram-dot" cx="17.1" cy="6.9" r="1"></circle>
            </svg>
            <span>Instagram</span>
            <span class="social-value">Instagram id</span>
        </a>
    </main>
</body>
</html>
